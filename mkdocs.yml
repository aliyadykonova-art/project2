site_name: bankval
site_description: Документация проекта проверки и валидации операций на одной странице

theme:
  name: material
  language: ru
  palette:
    # Фиксируем глубокую темную тему для всего сайта
    scheme: slate
    # Делаем верхнюю шапку (header) строгой угольно-черной
    primary: black
    # Назначаем цвет "голубого неба" для кнопок, ссылок, бэджей и навигации
    accent: light blue
  features:
    - navigation.sections
    - navigation.top
    - search.highlight

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

nav:
  - Главная: index.md
